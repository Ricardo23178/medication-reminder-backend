server:
  port: 8080

spring:
  application:
    name: medication-backend

  # 本地口令等私密配置放在项目根目录的 application-local.yml（已被 .gitignore 忽略）。
  # 文件不存在时跳过，不影响部署环境只靠环境变量启动。
  config:
    import: optional:file:./application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/medication_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 不设默认值：口令只从环境变量 DB_PASSWORD 或 application-local.yml 读取，禁止写进仓库
    password: ${DB_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 数据库下划线字段 -> Java 驼峰
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted        # 逻辑删除字段（sys_user/medicine/plan 等表统一叫 deleted）
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置：登录成功后签发的令牌
jwt:
  # HS256 密钥，至少 32 字节。本机开发够用；答辩部署时换成环境变量注入
  secret: ${JWT_SECRET:med-reminder-2026-graduation-jwt-secret-key-32bytes}
  expire-hours: 12
