server:
  port: 8080

spring:
  application:
    name: medication-backend

  # 本地开发凭据（数据库密码、JWT 密钥）统一放在 application-local.yml，
  # 该文件已被 .gitignore 排除，不会进入版本库。
  # 首次克隆后：复制 application-local.yml.example 为 application-local.yml 并填入自己的值。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/medication_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 数据库下划线字段 -> Java 驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发期打印 SQL，答辩演示用；上线可删
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted        # 逻辑删除字段（sys_user/medicine/plan 等表统一叫 deleted）
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置：登录成功后签发的令牌
jwt:
  # HS256 密钥，至少 32 字节。默认值仅供本地调试，部署环境请通过环境变量 JWT_SECRET 覆盖。
  secret: ${JWT_SECRET:dev-only-secret-please-override-in-production-32b}
  expire-hours: 12
